server:
  port: 8080

spring:
  application:
    name: conta-service
  datasource:
    # H2 em memoria: o projeto roda sem instalar nada. Os dados somem ao reiniciar.
    url: jdbc:h2:mem:contas;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true   # http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:contas)

antifraude:
  url: http://localhost:8081
